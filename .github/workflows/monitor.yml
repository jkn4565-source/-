name: 24시간 가격재고 감시 로봇

on:
push:
    branches: [ "main" ]
  schedule:
    - cron: '0 */3 * * *' # 3시간마다 실행
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  check-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 📥 코드 가져오기
      uses: actions/checkout@v3

    - name: 🐍 파이썬 설치
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 라이브러리 설치
      run: pip install requests

    - name: 🚀 감시 로봇 실행
      env:
        DOMEGGOOK_API_KEY: ${{ secrets.DOMEGGOOK_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python monitor.py

    - name: 💾 변동사항 저장
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add 재고모니터링.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 가격변동 업데이트" && git push)